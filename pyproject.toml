[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-pdf-rag"
version = "0.1.0"
description = "Daily incremental PDF ingestion and cited answers with LangChain and Chroma."
requires-python = ">=3.11"
dependencies = [
  "langchain-openai>=1.0,<2",
  "langchain-chroma>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "pypdf>=6,<7",
  "pydantic-settings>=2.10,<3",
  "filelock>=3.19,<4",
  "streamlit>=1.50,<2",
  "apscheduler>=3.11,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "reportlab>=4,<5"]

[project.scripts]
pdf-rag = "pdf_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
